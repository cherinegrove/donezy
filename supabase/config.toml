[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/confirm", "http://localhost:3000/set-password", "http://localhost:3000/reset-password", "http://localhost:3000/email-confirmation"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[db]
port = 54332
shadow_port = 54333

[api]
enabled = true
port = 54331
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[functions.api-create-task]
verify_jwt = false

[functions.api-create-client]
verify_jwt = false

[functions.api-create-project]
verify_jwt = false

[functions.send-task-reminders]
verify_jwt = false

[functions.send-recovery-email]
verify_jwt = false

[functions.smart-analytics]
verify_jwt = true

[functions.google-chat-send]
verify_jwt = true

[functions.google-chat-webhook]
verify_jwt = false

[functions.hubspot-sync-contacts]
verify_jwt = true

[functions.hubspot-sync-deals]
verify_jwt = true

[functions.hubspot-ticket-webhook]
verify_jwt = false

[functions.send-task-notification]
verify_jwt = false

[functions.generate-recurring-tasks]
verify_jwt = false

[functions.portal-add-task-comment]
verify_jwt = false

[storage]
enabled = true
file_size_limit = "52428800"

[storage.buckets.videos]
public = true
file_size_limit = "52428800"
allowed_mime_types = ["video/mp4", "video/webm", "video/quicktime"]

[storage.buckets.avatars]
public = true
file_size_limit = "1048576"
allowed_mime_types = ["image/png", "image/jpg", "image/jpeg", "image/gif", "image/webp"]

[storage.buckets.project-files]
public = false
file_size_limit = "52428800"
allowed_mime_types = ["*"]

[studio]
enabled = true
port = 54336

[inbucket]
enabled = true
smtp_port = 54338
pop3_port = 54339
port = 54334

[edge_runtime]
enabled = true
